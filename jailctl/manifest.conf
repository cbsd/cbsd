# is registered by core initenv before engine scanning (FK dependency).
ENGINE_NAME="jail"
ENGINE_VERSION="1.0"
ENGINE_DIR="jailctl"
ENGINE_PLATFORM="FreeBSD HardenedBSD"
ENGINE_DESCRIPTION="FreeBSD jail containers"
ENGINE_LS="jls"
ENGINE_TABLES="jails jailnic"
ENGINE_SCHEMAS="jails:jails jailnic:jailnic"
ENGINE_SUBR="jcreate.subr jstart.subr jrctl.subr jsetup-tui.subr"
