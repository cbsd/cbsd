# global test config

# What engine tests do we run by default?
[ -z "${BHYVE_TEST_ENABLE}" ] && BHYVE_TEST_ENABLE=1
[ -z "${JAIL_TEST_ENABLE}" ] && JAIL_TEST_ENABLE=1
[ -z "${XEN_TEST_ENABLE}" ] && XEN_TEST_ENABLE=1
[ -z "${QEMU_TEST_ENABLE}" ] && QEMU_TEST_ENABLE=1

[ -z "${PROFILES_TEST_ENABLE}" ] && PROFILES_TEST_ENABLE=1

# disable COLOR output
export NOCOLOR=1

# non-interactive
export NOINTER=1

# default distdir
[ -z "${CIX_DISTDIR}" ] && CIX_DISTDIR="/usr/local/cbsd"
globalconf="${CIX_DISTDIR}/cbsd.conf";

# default bin
if [ -z "${CIX_BIN}" ]; then
	CIX_BIN=$( which cbsd || which cix )
	if [ ! -x "${CIX_BIN}" ]; then
		echo "no CIX_BIN executable"
		exit 1
	fi
fi

### JAIL PART Settings
DEFAULT_FREEBSD_JAIL_VER="native"

# hardcoded:
#DEFAULT_FREEBSD_JAIL_INTERFACE="bridge1"
#DEFAULT_FREEBSD_JAIL_INTERFACE="cbsdbr0"
# or:
ifconfig cbsdbr0 > /dev/null 2>&1
if [ $? -eq 0 ]; then
	DEFAULT_FREEBSD_JAIL_INTERFACE="cbsdbr0"
else
	DEFAULT_FREEBSD_JAIL_INTERFACE="bridge1"
fi

### BHYVE PART Settings
DEFAULT_FREEBSD_PROFILE="cloud-FreeBSD-15.0-ufs-x86_64"
DEFAULT_LINUX_PROFILE="cloud-Ubuntuserver-24.04-x86_64"
