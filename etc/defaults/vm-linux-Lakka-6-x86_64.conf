# don't remove this line:
vm_profile="Lakka-6-x86_64"
vm_os_type="linux"

# this is one-string additional info strings in dialogue menu
long_description="Lakka: 6.1"

# custom settings:
fetch=1

# Official resources to fetch ISO's
# https://www.lakka.tv/get/linux/generic/
iso_site="\
https://le.builds.lakka.tv/x11.x86_64/ \
"

# Official CBSD project mirrors ( info: https://github.com/cbsd/mirrors )
cbsd_iso_mirrors="https://mirror.convectix.com/iso/ https://raw.githubusercontent.com/cbsd/mirrors/refs/heads/main/cbsd-iso.txt"

iso_img="Lakka-x11.x86_64-6.1.img.gz"

iso_img="Lakka-x11.x86_64-6.1.img"
iso_img_dist="Lakka-x11.x86_64-6.1.img.gz"

iso_extract="nice -n 19 ${IDLE_IONICE} ${GUNZIP_CMD} -d ${iso_img_dist}"

# copy ISO as hard drive
iso2img="1"

# register_iso as:
register_iso_name="cbsd-iso-lakka-amd64-7.4.1"
register_iso_as="iso-lakka-amd64-7.4.1"

default_jailname="lakka"
imgsize="11g"
imgsize_min="11g"

#virtio_type="ahci-hd"
virtio_type="virtio-blk"

# VNC
vm_vnc_port="0"
vm_efi="uefi"

# disable profile?
xen_active=1
bhyve_active=1
qemu_active=1

# Available in ClonOS?
clonos_active=0
sha256sum="cc139235344142f0f30f4f667128fea6f54077425ce8b81cbbdac7a9cb4bb9d7"
iso_img_dist_size="1390355478"

# enable birtio RNG interface?
virtio_rnd="1"

start_post_message="The GUI server uses modesettings by default. Please use GPU passthru: without a GPU/GOP this image is useless\n"
