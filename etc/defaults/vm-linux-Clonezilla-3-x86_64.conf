vm_profile="Clonezilla-3-x86_64"
# don't remove this line:
vm_os_type="linux"

# this is one-string additional info strings in dialogue menu
long_description="Clonezilla: 3.3.1"

# custom settings:
fetch=1

# Official resources to fetch ISO's
iso_site="\
https://twds.dl.sourceforge.net/project/clonezilla/clonezilla_live_stable/3.3.1-35/ \
https://sinalbr.dl.sourceforge.net/project/clonezilla/clonezilla_live_stable/3.3.1-35/ \
https://zenlayer.dl.sourceforge.net/project/clonezilla/clonezilla_live_stable/3.3.1-35/ \
"

# Official CBSD project mirrors ( info: https://github.com/cbsd/mirrors )
cbsd_iso_mirrors="https://mirror.convectix.com/iso/ https://raw.githubusercontent.com/cbsd/mirrors/refs/heads/main/cbsd-iso.txt"

iso_img="clonezilla-live-3.3.1-35-amd64.iso"

# register_iso as:
register_iso_name="cbsd-iso-clonezilla-live-3.3.1-35-amd64.iso"
register_iso_as="iso-clonezilla-live-3.3.1-35-amd64.iso"

default_jailname="clozilla"
imgsize="3g"
imgsize_min="3g"

# on virtio, Debian installer staled/freezed on Detecting HW stage
#virtio_type="ahci-hd"
virtio_type="virtio-blk"

# VNC
vm_vnc_port="0"
vm_efi="uefi"

# disable profile?
xen_active=1
bhyve_active=1
qemu_active=1

# Available in ClonOS?
clonos_active=1
sha256sum="ac4f88c8795a917e3d3fc1a3e52d095f35fe531d459cf853cd3e2c7731043fec"
iso_img_dist_size="485490688"

# enable birtio RNG interface?
virtio_rnd="1"

# firmware settings
cd_boot_firmware="bhyve"
[ ${freebsdhostversion} -lt 1301510 ] && hdd_boot_firmware="refind"
