# don't remove this line:
vm_profile="Ubuntu-server-26-x86_64"
vm_os_type="linux"
# this is one-string additional info strings in dialogue menu
long_description="Ubuntu: 26.04 server"

# custom settings:
fetch=1

# Official resources to fetch ISO's
iso_site="\
http://mirror.truenetwork.ru/ubuntu-releases/26.04/ \
http://mirror.pop-sc.rnp.br/mirror/ubuntu-releases/26.04/ \
http://ubuntu.mirrors.ovh.net/ubuntu-releases/26.04/ \
http://ftp.halifax.rwth-aachen.de/ubuntu-releases/26.04/ \
http://ubuntu.connesi.it/26.04/ \
http://mirror.nl.leaseweb.net/ubuntu-releases/26.04/ \
http://releases.ubuntu.com/26.04/ \
http://mirror.dogado.de/ubuntu-releases/26.04/ \
http://mirror.us.leaseweb.net/ubuntu-releases/26.04/ \
http://mirror.easyspeedy.com/ubuntu-iso/26.04/ \
https://mirror.timeweb.ru/ubuntu-releases/26.04/ \
http://mirror.waia.asn.au/ubuntu-releases/26.04/ \
"

# Official CBSD project mirrors ( info: https://github.com/cbsd/mirrors )
cbsd_iso_mirrors="https://mirror.convectix.com/iso/ https://raw.githubusercontent.com/cbsd/mirrors/refs/heads/main/cbsd-iso.txt"

iso_img="ubuntu-26.04-live-server-amd64.iso"

# register_iso as:
register_iso_name="cbsd-iso-ubuntu-26.04-live-server-amd64"
register_iso_as="iso-ubuntu-26.04-live-server-amd6"

default_jailname="ubuntu"

vm_package="small1"

# Required 7 GB for minimal ( '/' used: 2.5 + EFI + swap + X2 )
vm_ram="2g"
imgsize_min="7g"
imgsize="8g"

virtio_type="virtio-blk"
# on virtio, Debian installer staled/freezed on Detecting HW stage
#virtio_type="ahci-hd"

# VNC
vm_vnc_port="0"
vm_efi="uefi"

# disable profile?
xen_active=1
bhyve_active=1
qemu_active=1

# Available in ClonOS?
clonos_active=1

sha256sum="dec49008a71f6098d0bcfc822021f4d042d5f2db279e4d75bdd981304f1ca5d9"
iso_img_dist_size="2918598656"

# enable birtio RNG interface?
virtio_rnd="1"

# boot via refind
cd_boot_firmware="bhyve"
hdd_boot_firmware="refind"
