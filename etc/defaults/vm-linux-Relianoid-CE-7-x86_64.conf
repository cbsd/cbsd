vm_profile="Relianoid-CE-7-x86_64"
# don't remove this line:
vm_os_type="linux"

# this is one-string additional info strings in dialogue menu
long_description="Relianoid CE: 7.10.0"

# custom settings:
fetch=1

# Official resources to fetch ISO's
iso_site="\
https://sf-eu-introserv-1.dl.sourceforge.net/project/relianoid/ \
https://github.com/relianoid/adc-loadbalancer/releases/download/v7.10.0/ \
https://repo.relianoid.com/public/ \
https://deac-ams.dl.sourceforge.net/project/relianoid/ \
"

# Official CBSD project mirrors ( info: https://github.com/cbsd/mirrors )
cbsd_iso_mirrors="https://mirror.convectix.com/iso/ https://raw.githubusercontent.com/cbsd/mirrors/refs/heads/main/cbsd-iso.txt"

iso_img="relianoid_community_adc_installer_v7.10.0_amd64.iso"

# register_iso as:
register_iso_name="cbsd-iso-${iso_img}"
register_iso_as="iso-${iso_img}"

default_jailname="relianoid"
imgsize="10g"
imgsize_min="3g"

# on virtio, Debian installer staled/freezed on Detecting HW stage
#virtio_type="ahci-hd"
virtio_type="virtio-blk"

# VNC
vm_vnc_port="0"
vm_efi="uefi"

# disable profile?
xen_active=1
bhyve_active=1
qemu_active=1

# Available in ClonOS?
clonos_active=1
sha256sum="c5d1b8a7c287189f079830d61c1ce9cb3d0ed2ad19b337e7afa653a0f7288937"
iso_img_dist_size="772800512"

# enable birtio RNG interface?
virtio_rnd="1"

# firmware settings
cd_boot_firmware="bhyve"
[ ${freebsdhostversion} -lt 1301510 ] && hdd_boot_firmware="refind"
