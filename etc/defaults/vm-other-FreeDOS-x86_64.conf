# don't remove this line:
vm_profile="FreeDOS-x86_64"
vm_os_type="other"
# this is one-string additional info strings in dialogue menu
long_description="FreeDOS: 1.4"

# custom settings:
fetch=1

# Official resources to fetch ISO's

# Official resources to fetch ISO's
iso_site="\
https://www.ibiblio.org/pub/micro/pc-stuff/freedos/files/distributions/1.4/ \
"

# Official CBSD project mirrors ( info: https://github.com/cbsd/mirrors )
cbsd_iso_mirrors="https://mirror.convectix.com/iso/ https://raw.githubusercontent.com/cbsd/mirrors/refs/heads/main/cbsd-iso.txt"

iso_img="FD14LIVE.iso"
iso_img_dist="FD14-LiveCD.zip"

iso_extract="nice -n 19 ${IDLE_IONICE} ${TAR_CMD} xfz ${iso_img_dist}"

default_jailname="dos"
imgsize="2g"

# register_iso as:
register_iso_name="cbsd-iso-${iso_img}"
register_iso_as="iso-${vm_profile}"

#virtio_type="ahci-hd"

# VNC
vm_vnc_port="0"
vm_efi="uefi_csm"
bhyve_vnc_vgaconf="off"           # vgaconf

# disable profile?
xen_active=1
bhyve_active=0
qemu_active=1

# Available in ClonOS?
clonos_active=0

# VirtualBox Area
virtualbox_ostype="Other_64"

# enable birtio RNG interface?
virtio_rnd="0"
