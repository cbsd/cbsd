# you can reassign default script/service to select automatic IPv4 for env
# 'internal' - use buildin CBSD script
# Please keep original behavior and exit codes ( see 'cbsd dhcpd --help' )
dhcpd_helper="internal"

# If you want PHP IPAM integration:
#  mkdir /root/bin
#  cp /usr/local/cbsd/modules/ipam.d/share/dhcpd/dhcpd-ipam /root/bin
#  + adjust network pool in /root/bin/dhcpd-ipam and set dhcpd_helper:
#
#dhcpd_helper="/root/bin/dhcpd-ipam"

# IPs blacklist - exclude IPs from DHCP pool, e.g.:
#dhcpd_ipv4_exclude="192.168.0.5-10 10.0.0.1 10.0.0.254 192.168.0.20/29"
dhcpd_ipv4_exclude=
