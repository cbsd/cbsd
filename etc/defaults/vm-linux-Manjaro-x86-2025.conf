# don't remove this line:
vm_profile="Manjaro-x86-2025"
vm_os_type="linux"
# this is one-string additional info strings in dialogue menu
long_description="Manjaro Linux: 24.2.1"

# custom settings:
fetch=1

# Official resources to fetch ISO's
iso_site="\
https://download.manjaro.org/kde/25.0.0/ \
https://psychz.dl.sourceforge.net/project/manjarolinux/kde/25.0.0/ \
"

# Official CBSD project mirrors ( info: https://github.com/cbsd/mirrors )
cbsd_iso_mirrors="https://mirror.convectix.com/iso/ https://raw.githubusercontent.com/cbsd/mirrors/refs/heads/main/cbsd-iso.txt"

iso_img="manjaro-kde-25.0.0-250414-linux612.iso"

# register_iso as:
register_iso_name="cbsd-iso-${iso_img}"
register_iso_as="iso-${iso_img}"

default_jailname="manj"
# At least 8 GiB is required
imgsize="9g"

#virtio_type="ahci-hd"
virtio_type="virtio-blk"

# mouse not work with tablet=1
tablet=0

# VNC
vm_vnc_port="0"
vm_efi="uefi"

# disable profile?
xen_active=1
bhyve_active=1
qemu_active=1

# Available in ClonOS?
clonos_active=1
sha256sum="523fadcb7750d704a40cf72c15cd524e4c4b3211dc743db40b3028adf688c609"
iso_img_dist_size="4507607040"

# enable birtio RNG interface?
virtio_rnd="1"

# firmware settings
cd_boot_firmware="bhyve"
[ ${freebsdhostversion} -lt 1301510 ] && hdd_boot_firmware="refind"
