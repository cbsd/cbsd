# don't remove this line:
vm_profile="MidnightBSD-4-x86_64"
vm_os_type="freebsd"
# this is one-string additional info strings in dialogue menu
long_description="MidnightBSD: 4.0.1-RELEASE"

# custom settings:
fetch=1

# Official resources to fetch ISO's
iso_site="\
https://pub.allbsd.org/MidnightBSD/releases/amd64/ISO-IMAGES/4.0.1/ \
https://ns3.foolishgames.net/ftp/pub/MidnightBSD/releases/amd64/ISO-IMAGES/4.0.1/ \
https://www.midnightbsd.org/ftp/MidnightBSD/releases/amd64/ISO-IMAGES/4.0.1/ \
https://discovery.midnightbsd.org/ftp/releases/amd64/ISO-IMAGES/4.0.1/ \
"

# Official CBSD project mirrors ( info: https://github.com/cbsd/mirrors )
cbsd_iso_mirrors="https://mirror.convectix.com/iso/ https://raw.githubusercontent.com/cbsd/mirrors/refs/heads/main/cbsd-iso.txt"

iso_img="MidnightBSD-4.0.1--amd64-disc1.iso"
iso_img_dist=

iso_extract=

# Did not find a page with minimum requirements on the MidnightBSD site, 
# but FreeBSD handbook recommends 2g+ for the Desktop station.
# https://docs.freebsd.org/doc/13.0-RELEASE/usr/local/share/doc/freebsd/en_US.ISO8859-1/books/handbook/bsdinstall-hardware.html
vm_ram=2g

# register_iso as:
register_iso_name="cbsd-iso-${iso_img}"
register_iso_as="iso-MidnightBSD-4.0.1-amd64-disc1"

default_jailname="mnight"

# disable profile?
xen_active=1
bhyve_active=1
qemu_active=1

# Available in ClonOS?
clonos_active=1

# VNC
vm_vnc_port="0"
vm_efi="uefi"

vm_package="small1"

# VirtualBox Area
virtualbox_ostype="FreeBSD_64"

sha256sum="408efa546d478c5b8c810584c86c3c1dfd7a3c4e16534853961b91ec98cfe6f8"
iso_img_dist_size="1054531584"

# enable birtio RNG interface?
virtio_rnd="1"

# default boot firmware
cd_boot_firmware="bhyve"
hdd_boot_firmware="bhyve"
