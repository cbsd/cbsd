vm_profile="Chimera-plasma-2026-x86_64"
# don't remove this line:
vm_os_type="linux"

# this is one-string additional info strings in dialogue menu
long_description="Chimera: 13.3.0"

# custom settings:
fetch=1

# Official resources to fetch ISO's
iso_site="\
https://repo.chimera-linux.org/live/20251220/ \
"

# Official CBSD project mirrors ( info: https://github.com/cbsd/mirrors )
cbsd_iso_mirrors="https://mirror.convectix.com/iso/ https://raw.githubusercontent.com/cbsd/mirrors/refs/heads/main/cbsd-iso.txt"

iso_img="chimera-linux-x86_64-LIVE-20251220-plasma.iso"

# register_iso as:
register_iso_name="cbsd-iso-chimera-linux-x86_64-LIVE-20251220-plasma"
register_iso_as="iso-chimera-linux-x86_64-LIVE-20251220-plasma"

default_jailname="chimera"
imgsize="12g"
imgsize_min="10g"

virtio_type="virtio-blk"

# VNC
vm_vnc_port="0"
vm_efi="uefi"

# disable profile?
xen_active=1
bhyve_active=1
qemu_active=1

# Available in ClonOS?
clonos_active=1
sha256sum="a963ec89f349c56578cca5a9811f0bd5c383bc0c6f2de36871462607d32050c1"
iso_img_dist_size="2525401088"

# enable birtio RNG interface?
virtio_rnd="1"

# firmware settings
cd_boot_firmware="bhyve"
[ ${freebsdhostversion} -lt 1301510 ] && hdd_boot_firmware="refind"
