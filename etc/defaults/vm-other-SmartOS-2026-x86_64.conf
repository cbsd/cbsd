# don't remove this line:
vm_profile="SmartOS-2026-x86_64"
vm_os_type="other"
# this is one-string additional info strings in dialogue menu
long_description="SmartOS: 20260205"

# custom settings:
fetch=1

# Official resources to fetch ISO's
iso_site="\
https://us-central.manta.mnx.io/Joyent_Dev/public/SmartOS/20260205T001426Z/ \
"

# Official CBSD project mirrors ( info: https://github.com/cbsd/mirrors )
cbsd_iso_mirrors="https://mirror.convectix.com/iso/ https://raw.githubusercontent.com/cbsd/mirrors/refs/heads/main/cbsd-iso.txt"

iso_img="smartos-20260205T001426Z.iso"

# register_iso as:
register_iso_name="cbsd-iso-smartos-20260205T001426Z"
register_iso_as="iso-smartos-smartos-20260205T001426Z"

default_jailname="smartos"
virtio_type="ahci-hd"

# disable XHCI
# WARNING: /pci@0,0/pci8086,1e31@1e (xhci0): Connecting device on port 1 failed
xhci=0

# disable profile?
xen_active=1
bhyve_active=1
qemu_active=1

# Available in ClonOS?
clonos_active=1

# VNC
vm_vnc_port="0"
vm_efi="uefi"

#vm_console="nmdm"
vm_package="small1"

# VirtualBox Area
virtualbox_ostype="MacOS109_64"

# this is latest, disable CRC check
sha256sum="cca4d3df6e639fc17668c700847a799996c03f3c8b42dbd359533e4931208b75"

# enable birtio RNG interface?
virtio_rnd="0"
iso_img_dist_size="632131584"
