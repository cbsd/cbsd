# Dedicated syslogd for CBSD jails. Pass this file as syslogd -f.
# cbsdlogctl create and destroy manage <jname>.conf in the directory below.
# initenv copies this file to ${workdir}/etc and replaces %%workdir%%.
#
# One rule must exist even when cbsdlog.d has no *.conf. FreeBSD syslogd
# aborts if the parsed config has no actions: casper omits nvl_conf and
# nvlist_take_nvlist() raises SIGABRT. This program name is never used.
!cbsdlog-keep
*.*						/dev/null
!*
include	%%workdir%%/etc/cbsdlog.d
