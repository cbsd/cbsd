### bsddialog theme - Wed Apr  8 00:15:07 2026

## Settings
# Available colors: black, red, green, yellow, blue, magenta, cyan, white.
# Available attributes: bold, reverse, underline, blink, halfbright, highlight.
# Prefix f_* indicates the focused state of an element, whether selected or not.

version 1.2-wip

# Terminal
theme.screen.color yellow black

# Shadow
theme.shadow.color black black
# shift down right from main widget
theme.shadow.y 1
theme.shadow.x 2

# Main widget
theme.dialog.color yellow black
theme.dialog.delimtitle true
theme.dialog.titlecolor yellow black bold
theme.dialog.lineraisecolor white black
theme.dialog.linelowercolor white black
theme.dialog.bottomtitlecolor yellow black bold
theme.dialog.arrowcolor yellow black bold

# Menus: --checklist, --menu, --radiolist
# prefix [selector] shortcut name desc bottomdesc
theme.menu.f_prefixcolor white black
theme.menu.prefixcolor white black
theme.menu.f_selectorcolor white magenta
theme.menu.selectorcolor white black
theme.menu.f_namecolor white magenta
theme.menu.namecolor white black
theme.menu.f_desccolor white magenta
theme.menu.desccolor white black
theme.menu.f_shortcutcolor white magenta
theme.menu.shortcutcolor yellow black
theme.menu.bottomdesccolor yellow black
# bsddialog_menutype BSDDIALOG_SEPARATOR
theme.menu.sepnamecolor white black
theme.menu.sepdesccolor white black

# Forms
theme.form.f_fieldcolor black white
theme.form.fieldcolor white magenta
theme.form.readonlycolor yellow black
theme.form.bottomdesccolor white black

# Bar of --gauge, --mixedgauge, --pause, --rangebox
theme.bar.f_color white magenta bold
theme.bar.color white black bold

# Spinbox of --calendar, --datebox, --timebox
theme.spinbox.f_color white magenta
theme.spinbox.color white black

# Buttons
theme.button.minmargin 1
theme.button.maxmargin 5
theme.button.leftdelim [
theme.button.rightdelim ]
theme.button.f_delimcolor white magenta bold
theme.button.delimcolor white black
theme.button.f_color white magenta bold
theme.button.color white black bold
theme.button.f_shortcutcolor yellow magenta bold
theme.button.shortcutcolor yellow black bold
