#          run: |
#            sudo env NOINTER=1 /usr/local/cbsd/tests/runall-jail

      - name: Shutdown VM
        uses: cross-platform-actions/action@v0.32.0
        env:
          ASSUME_ALWAYS_YES: yes
        with:
          operating_system: freebsd
          version: '15.0'
          architecture: x86-64
          shell: sh
          memory: 4G
          cpu_count: 2
          sync_files: false
          shutdown_vm: true
          environment_variables: ASSUME_ALWAYS_YES
          run: true

